[app]
name = "prove-it-independent-dev"
port = 8080
command = ["/usr/bin/env", "PROVE_IT_ADVERSARIAL_DEMO=1", "/usr/local/bin/prove-it"]

[storage]
paths = ["/state/app-data"]
size = "1Gi"
tls_size = "2Gi"

[unlock]
mode = "password"

[resources]
cpu = "1"
memory = "512Mi"

[health]
path = "/livez"
interval = 30
timeout = 10
