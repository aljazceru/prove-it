name: Build Prove-It Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional extra image tag to publish. Manual tags must start with manual-."
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/image.yml"
      - "Dockerfile"
      - "*.go"
      - "go.mod"
      - "web/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/image.yml"
      - "Dockerfile"
      - "*.go"
      - "go.mod"
      - "web/**"
      - "scripts/**"

env:
  PROVE_IT_IMAGE_REPOSITORY: ghcr.io/aljazceru/prove-it
  MANUAL_VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || '' }}

jobs:
  validate:
    name: Validate prove-it image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate manual image tag
        if: env.MANUAL_VERSION_TAG != ''
        run: |
          if [[ ! "${MANUAL_VERSION_TAG}" =~ ^manual-[a-z0-9][a-z0-9_.-]{0,119}$ ]]; then
            echo "::error::Manual image tags must match ^manual-[a-z0-9][a-z0-9_.-]{0,119}$ to avoid spoofing protected deployment tags."
            exit 1
          fi

      - name: Shell syntax
        run: |
          bash -n scripts/verify-image-ref.sh
          bash -n scripts/smoke-runtime.sh

      - uses: actions/setup-go@f111f3307d8850f501ac008e92ed538cccdc2cdd # v6.0.0
        with:
          go-version: "1.22"
          cache: false

      - name: go vet + test
        run: |
          go vet ./...
          go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: prove-it:ci
          load: true
          provenance: false

      - name: Runtime contract
        run: scripts/smoke-runtime.sh prove-it:ci

  publish:
    name: Publish signed prove-it image
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc0fe9291f23a2a2e9 # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.PROVE_IT_IMAGE_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ env.MANUAL_VERSION_TAG }},enable=${{ env.MANUAL_VERSION_TAG != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prove-it
          cache-to: type=gha,mode=max,scope=prove-it
          provenance: true

      - name: Write image digest artifact
        run: |
          mkdir -p dist
          image_ref="${PROVE_IT_IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}"
          printf '%s\n' "${image_ref}" > dist/prove-it-image.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign pushed digest
        env:
          IMAGE: ${{ env.PROVE_IT_IMAGE_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signed digest
        run: scripts/verify-image-ref.sh --cosign dist/prove-it-image.txt

      - name: Upload image digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prove-it-image
          path: dist/prove-it-image.txt
